services:
  pixelwrangler:
    image: ghcr.io/firworksyt/pixelwrangler:latest
    build:
      context: .
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        COMMIT_DATE: ${COMMIT_DATE:-}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Static files only: nothing needs to be writable except nginx's /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
