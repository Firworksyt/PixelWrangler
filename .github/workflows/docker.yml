name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    branches: [ master ]
    types: [ completed ]

jobs:
  build:
    # Only run if CI succeeded on a push (not a PR)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Lowercase repo name
      run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ env.REPO }}
        tags: |
          type=raw,value=latest
          type=sha,prefix=

    - name: Set build metadata
      run: |
        echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
        echo "COMMIT_DATE=$(git log -1 --format=%cI)" >> $GITHUB_ENV

    - name: Build amd64 image for smoke test
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: ghcr.io/${{ env.REPO }}:test
        build-args: |
          COMMIT_HASH=${{ github.event.workflow_run.head_sha }}
          COMMIT_DATE=${{ env.COMMIT_DATE }}
          BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}

    - name: Smoke test container
      run: |
        docker run -d --name test-container -p 8080:8080 ghcr.io/${{ env.REPO }}:test
        for i in $(seq 1 20); do curl -fs http://localhost:8080/version.json && break; sleep 1; done
        echo
        curl -fsS http://localhost:8080/ | grep -q "<title>Pixel Wrangler</title>"
        curl -fsS http://localhost:8080/worker.js > /dev/null
        curl -fsS http://localhost:8080/lib/pipeline.js > /dev/null
        curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
        curl -fs http://localhost:8080/version.json | grep -q "${{ github.event.workflow_run.head_sha }}"
        docker logs test-container
        docker stop test-container

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          COMMIT_HASH=${{ github.event.workflow_run.head_sha }}
          COMMIT_DATE=${{ env.COMMIT_DATE }}
          BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
