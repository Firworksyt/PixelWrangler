server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Images are processed in the browser and never sent anywhere. The only
    # outbound request the page may make is fetching a palette from Lospec.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://lospec.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Files aren't fingerprinted, so always revalidate; a redeploy shows up on next load.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
